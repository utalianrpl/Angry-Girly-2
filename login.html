<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Glass Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#434257,#054747,#0f3479,#3b0d3b);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating circles */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(46, 58, 231, 0.137);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:220px;
    height:220px;
    top:8%;
    left:10%;
}

.circle:nth-child(2){
    width:320px;
    height:320px;
    bottom:-80px;
    right:-80px;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    bottom:20%;
    left:15%;
    animation-delay:4s;
}

@keyframes float{
    50%{
        transform:translateY(-25px);
    }
}

.card{
    width:360px;
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 40px rgba(0,0,0,.25);
    color:white;
    z-index:10;
}

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    margin:auto;
    background:linear-gradient(135deg,#ffffff,#dfe9f3);
    color:#6C63FF;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:30px;
    font-size:14px;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px 20px;
    border:none;
    outline:none;
    border-radius:50px;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-box input::placeholder{
    color:rgba(255,255,255,.75);
}

.input-box input:focus{
    background:rgba(255,255,255,.25);
    box-shadow:0 0 15px rgba(255,255,255,.4);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    margin-bottom:20px;
}

.options a{
    color:white;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(90deg,#0c75d6,#0f7c39);
    color:white;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(252,0,255,.4);
}

.signup{
    text-align:center;
    margin-top:25px;
    font-size:14px;
}

.signup a{
    color:white;
    font-weight:bold;
    text-decoration:none;
}

#message{
    text-align:center;
    margin-top:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<div class="logo">L</div>

<h2>Welcome Back</h2>
<p class="subtitle">Sign in to continue</p>

<div class="input-box">
<input type="text" id="username" placeholder="Username">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password">
</div>

<div class="options">
<label>
<input type="checkbox">
 Remember
</label>

<a href="#">Forgot Password?</a>
</div>

<button onclick="login()">LOGIN</button>

<p id="message"></p>

<div class="signup">
Don't have an account?
<a href="#">Create one</a>
</div>

</div>

<script>
function login(){

const user=document.getElementById("username").value;
const pass=document.getElementById("password").value;

if(user==="admin" && pass==="12345"){
    document.getElementById("message").style.color="#7CFF8D";
    document.getElementById("message").innerHTML="✔ Login Successful!";
}
else{
    document.getElementById("message").style.color="#FFD4D4";
    document.getElementById("message").innerHTML="✖ Invalid Username or Password";
}

}
</script>

</body>
</html>
